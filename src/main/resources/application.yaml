server:
  # Honra X-Forwarded-Proto/Host del proxy de Render: así request.isSecure()
  # es true en producción → se emite HSTS y se reconoce el contexto HTTPS.
  forward-headers-strategy: framework
  tomcat:
    connection-timeout: 600000  # 10 minutos para conexiones Tomcat

spring:
  application:
    name: backendapi

  mvc:
    async:
      request-timeout: 600000   # 10 minutos para peticiones asíncronas

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 10000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp.use_jdbc_metadata_defaults: false
        boot.allow_jdbc_metadata_access: false

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}
  bucket: ${SUPABASE_BUCKET}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}

tripo:
  api-key: ${TRIPO_API_KEY}
  base-url: https://api.tripo3d.ai/v2/openapi
